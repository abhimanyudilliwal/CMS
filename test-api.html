<!DOCTYPE html>
<html>
<head>
    <title>Test CMS API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 CMS API Diagnostic Tool</h1>
    
    <div class="test info">
        <h3>Step 1: Check Server</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <pre id="health-result">Click button to test...</pre>
    </div>

    <div class="test info">
        <h3>Step 2: Login Test</h3>
        <button onclick="testLogin()">Test Login</button>
        <pre id="login-result">Click button to test...</pre>
    </div>

    <div class="test info">
        <h3>Step 3: Test Author API</h3>
        <button onclick="testAuthorAPI()">Test Author API (requires login)</button>
        <pre id="author-result">Click button to test...</pre>
    </div>

    <div class="test info">
        <h3>Token (Saved in localStorage):</h3>
        <pre id="token-display">No token found</pre>
        <button onclick="clearToken()">Clear Token</button>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let currentToken = null;

        async function testHealth() {
            const result = document.getElementById('health-result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                result.parentElement.className = response.ok ? 'test success' : 'test error';
            } catch (error) {
                result.innerHTML = 'ERROR: ' + error.message;
                result.parentElement.className = 'test error';
            }
        }

        async function testLogin() {
            const result = document.getElementById('login-result');
            result.innerHTML = 'Testing login with author@cms.com / author123...';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'author@cms.com',
                        password: 'author123'
                    })
                });
                const data = await response.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                
                if (data.token) {
                    currentToken = data.token;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    document.getElementById('token-display').innerHTML = data.token.substring(0, 50) + '...';
                }
                
                result.parentElement.className = response.ok ? 'test success' : 'test error';
            } catch (error) {
                result.innerHTML = 'ERROR: ' + error.message;
                result.parentElement.className = 'test error';
            }
        }

        async function testAuthorAPI() {
            const result = document.getElementById('author-result');
            result.innerHTML = 'Testing...';
            
            const token = localStorage.getItem('token');
            if (!token) {
                result.innerHTML = 'No token found. Please login first.';
                result.parentElement.className = 'test error';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/author/my-content`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                result.parentElement.className = response.ok ? 'test success' : 'test error';
            } catch (error) {
                result.innerHTML = 'ERROR: ' + error.message;
                result.parentElement.className = 'test error';
            }
        }

        function clearToken() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            document.getElementById('token-display').innerHTML = 'No token found';
        }

        // Check for existing token
        window.onload = () => {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('token-display').innerHTML = token.substring(0, 50) + '...';
            }
        };
    </script>
</body>
</html>
